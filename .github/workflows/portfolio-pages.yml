name: Deploy portfolio and SUWENKU

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'suwenku/**'
      - '.github/workflows/portfolio-pages.yml'
  pull_request:
    paths:
      - 'portfolio/**'
      - 'suwenku/**'
      - '.github/workflows/portfolio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: 22
      - name: Install portfolio dependencies
        working-directory: portfolio
        run: npm install --no-audit --no-fund
      - name: Run portfolio unit tests
        working-directory: portfolio
        run: npm test
      - name: Build portfolio and enforce bundle budgets
        working-directory: portfolio
        run: npm run build
      - name: Install Playwright browsers
        working-directory: portfolio
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser desktop and mobile tests
        working-directory: portfolio
        run: npm run test:e2e
      - name: Run SUWENKU tests
        working-directory: suwenku
        run: npm test
      - name: Run SUWENKU API smoke
        working-directory: suwenku
        run: npm run smoke
      - name: Validate SUWENKU frontend
        run: |
          test -f suwenku/index.html
          test -f suwenku/styles.css
          test -f suwenku/app.js
          grep -q 'MOMOHA' suwenku/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: 22
      - name: Install portfolio dependencies
        working-directory: portfolio
        run: npm install --no-audit --no-fund
      - name: Build portfolio
        working-directory: portfolio
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Prepare static site
        run: |
          mkdir -p _site/portfolio _site/suwenku
          cp -R portfolio/dist/. _site/portfolio/
          cp -R suwenku/. _site/suwenku/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
