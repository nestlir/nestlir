<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>50+ Projects Lab</title><script src="./site.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1320px;margin:auto;padding:0 24px}.nav{padding:22px 0;display:flex;justify-content:space-between;border-bottom:1px solid #27272a}.brand{font-weight:900;font-size:20px}.brand b{color:#a3e635}.hero{padding:80px 0 48px}.k{color:#a3e635;font-size:12px;letter-spacing:.14em}.hero h1{font-size:clamp(58px,10vw,120px);line-height:.86;letter-spacing:-.07em;margin:20px 0}.hero p{max-width:680px;color:#a1a1aa;font-size:18px;line-height:1.6}.controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin:30px 0}.search,.sort{background:#111113;border:1px solid #3f3f46;color:#fff;border-radius:14px;padding:15px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.chip{background:#111113;border:1px solid #3f3f46;color:#d4d4d8;border-radius:999px;padding:9px 13px;cursor:pointer}.chip.active{background:#a3e635;color:#111;border-color:#a3e635}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:80px}.card{background:#111113;border:1px solid #27272a;border-radius:22px;overflow:hidden}.thumb{height:180px;background:linear-gradient(135deg,var(--a),var(--b));position:relative;padding:16px}.window{height:100%;border:1px solid #ffffff30;border-radius:10px;background:#09090b99;padding:12px}.window i,.window b,.window em{display:block;background:#ffffff25;border-radius:9px;margin-bottom:10px}.window i{height:8px;width:35%;background:#a3e635}.window b{height:62px}.window em{height:8px;width:70%}.body{padding:18px}.meta{font-size:11px;color:#a1a1aa;display:flex;justify-content:space-between}.card h2{font-size:21px;margin:12px 0 18px}.actions{display:flex;gap:8px}.btn{flex:1;padding:10px;text-align:center;border-radius:10px;border:1px solid #3f3f46;background:#18181b;color:#fff;text-decoration:none;cursor:pointer}.btn.primary{background:#a3e635;color:#111;border-color:#a3e635;font-weight:800}.empty{grid-column:1/-1;padding:50px;text-align:center;color:#a1a1aa;border:1px dashed #3f3f46;border-radius:18px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.hero{padding-top:55px}}
</style></head><body><main class="wrap"><nav class="nav"><div class="brand">50<b>+</b> Projects Lab</div><div id="count"></div></nav><section class="hero"><div class="k">FRONTEND ENGINEERING ARCHIVE</div><h1>51 projects.<br>One experience.</h1><p>Browse real project demos, search the collection, filter by skill area and open each project on its own demo page with previous/next navigation.</p></section><section><div class="controls"><input id="search" class="search" placeholder="Search all 51 projects…"><select id="sort" class="sort"><option value="order">Original order</option><option value="az">A → Z</option><option value="za">Z → A</option></select></div><div id="chips" class="chips"></div><div id="grid" class="grid"></div></section></main><script>
window.addEventListener('DOMContentLoaded',()=>{const grid=document.querySelector('#grid'),search=document.querySelector('#search'),sort=document.querySelector('#sort'),chips=document.querySelector('#chips'),count=document.querySelector('#count');let active='All';const cats=['All',...new Set(projects.map(p=>p.category))],colors=[['#155e75','#0f172a'],['#3f6212','#18181b'],['#7c2d12','#18181b'],['#5b21b6','#111827'],['#9f1239','#111827'],['#1e40af','#0f172a']];function renderChips(){chips.innerHTML=cats.map(c=>'<button class="chip '+(active===c?'active':'')+'" data-c="'+c+'">'+c+'</button>').join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;renderChips();render()})}function render(){let q=search.value.toLowerCase();let list=projects.filter(p=>(active==='All'||p.category===active)&&(p.name+' '+p.category).toLowerCase().includes(q));if(sort.value==='az')list.sort((a,b)=>a.name.localeCompare(b.name));if(sort.value==='za')list.sort((a,b)=>b.name.localeCompare(a.name));count.textContent=list.length+' / 51 projects';grid.innerHTML=list.map(p=>{let c=colors[p.id%colors.length];return '<article class="card"><div class="thumb" style="--a:'+c[0]+';--b:'+c[1]+'"><div class="window"><i></i><b></b><em></em></div></div><div class="body"><div class="meta"><span>#'+String(p.id).padStart(2,'0')+'</span><span>'+p.category+'</span></div><h2>'+p.name+'</h2><div class="actions"><a class="btn primary" href="'+projectPath(p)+'">Open demo</a><a class="btn" target="_blank" href="'+sourceUrl(p)+'">Source ↗</a></div></div></article>'}).join('')||'<div class="empty">No projects found.</div>'}search.oninput=render;sort.onchange=render;renderChips();render()});
</script></body></html>
