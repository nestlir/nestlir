rt(2,'0');cat.textContent=p.category;title.textContent=p.name;pos.textContent=(i+1)+' / '+projects.length;source.href=sourceUrl(p);demo.src=demoUrl(p);prev.href='../'+String(prevP.id).padStart(2,'0')+'-'+prevP.slug+'/';prev.textContent='← '+prevP.name;next.href='../'+String(nextP.id).padStart(2,'0')+'-'+nextP.slug+'/';next.textContent=nextP.name+' →';}</script></body></html>
