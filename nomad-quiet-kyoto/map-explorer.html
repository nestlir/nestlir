<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NOMAD — Kyoto map explorer.">
  <title>NOMAD — Kyoto / Map Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="map-explorer.css">
</head>
<body>
  <header class="map-header">
    <a class="wordmark" href="index.html">NOMAD</a>
    <p>KYOTO / MAP EXPLORER</p>
    <a class="back" href="index.html">Back to journal ↗</a>
  </header>

  <main class="map-layout">
    <section class="map-canvas" aria-label="Illustrated map of Kyoto">
      <div class="map-wash"></div>
      <div class="river"></div>
      <div class="road road-a"></div>
      <div class="road road-b"></div>
      <div class="road road-c"></div>
      <div class="map-label label-north">NORTH</div>
      <div class="map-label label-kamo">KAMO RIVER</div>
      <div class="map-label label-gion">GION</div>
      <div class="map-label label-higashiyama">HIGASHIYAMA</div>
      <div class="map-label label-fushimi">FUSHIMI</div>

      <button class="map-pin is-active" style="--x:36%;--y:65%" data-place="fushimi" aria-label="Fushimi Inari"></button>
      <button class="map-pin" style="--x:60%;--y:47%" data-place="higashiyama" aria-label="Higashiyama"></button>
      <button class="map-pin" style="--x:57%;--y:35%" data-place="nishiki" aria-label="Nishiki Market"></button>
      <button class="map-pin" style="--x:69%;--y:54%" data-place="gion" aria-label="Gion"></button>

      <svg class="route-path" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
        <path id="routePath" d="M360 455 C420 410 500 370 570 325 C620 345 650 375 690 380"></path>
      </svg>

      <div class="map-note">A slower way<br>of finding your way.</div>
      <div class="map-scale">0 — 1 — 2 km</div>
    </section>

    <aside class="place-panel" aria-live="polite">
      <div class="place-topline"><span id="placeIndex">01 / 04</span><span id="placeType">WALK</span></div>
      <div class="place-image" id="placeImage" role="img" aria-label="Fushimi Inari"></div>
      <div class="place-copy">
        <p class="place-time" id="placeTime">07:10</p>
        <h1 id="placeTitle">Fushimi<br><em>Inari</em></h1>
        <p id="placeDescription">Begin beneath a thousand vermilion gates, before the city has fully woken.</p>
        <div class="place-meta">
          <span id="placeArea">Fushimi / South Kyoto</span>
          <span id="placeDuration">01h 40m</span>
        </div>
        <button class="add-place" id="addPlace" type="button" aria-pressed="false">Add to My Day <span>+</span></button>
      </div>
    </aside>
  </main>

  <script src="map-explorer.js" defer></script>
</body>
</html>
